name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore FraFactu.sln

      - name: Build
        run: dotnet build FraFactu.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test FraFactu.sln --configuration Release --no-build --verbosity normal
